services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: wigtn-agents-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegra}
      POSTGRES_USER: ${POSTGRES_USER:-aegra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegra}
    ports:
      # Host 5432 is taken by a local PostgreSQL; expose on 5433 instead.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - wigtn_agents_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional enable with `docker compose --profile redis up -d`
  redis:
    image: redis:7-alpine
    container_name: wigtn-agents-redis
    profiles: ["redis"]
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wigtn_agents_pgdata:
