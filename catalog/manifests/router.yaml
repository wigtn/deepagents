apiVersion: wigtn.agents/v1
kind: agent
metadata:
  name: router
  version: 1
  owner: platform
  worker_class: interactive
  description: 진입 라우터 · agent_id 없이 들어온 요청을 ERP 업무 에이전트로 넘긴다. 라우팅 표는 skill 자산
model: {ref: models/default, temperature: 0.0, max_tokens: 1024}
harness_preset: standard
skills: [skill://routing/erp-domains@active]
prompts: {system: prompt://router/system@active}
flow: {template: react}
permissions:
  allow_tools: [tool://delegate-run@active]
sel: {mutable_by_sel: []}
