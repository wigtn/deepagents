apiVersion: wigtn.agents/v1
kind: agent
metadata:
  name: records-guide
  version: 2
  owner: agents
  worker_class: interactive
  description: 점검 절차 안내 · read 전용 · 대화형
model: {ref: models/default, temperature: 0.1, max_tokens: 2048}
harness_preset: interactive-read
skills: [skill://example/checklist@active]
prompts: {system: prompt://records/system@active}
flow: {template: react}
permissions:
  allow_tools: [tool://record-read@active, tool://view-read@active]
  data_scope: [view:default]
sel: {mutable_by_sel: []}
