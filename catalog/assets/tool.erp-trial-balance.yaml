kind: tool
name: erp-trial-balance
version: 1
status: active
owner: platform
description: 시산표. 계정별 기초 · 차변 · 대변 · 기말 잔액
permission_scope: [read:ledger]
mutable_by_sel: []
provenance: {created_by: human}
body:
  input_schema:
    type: object
    properties:
      company: {type: string, description: "회사 코드. 실행 범위에서 시스템이 채운다"}
      period: {type: string, description: "YYYY-MM. 비우면 열린 기간"}
  output_schema: {type: object, properties: {accounts: {type: array}, balanced: {type: boolean}}}
  side_effect: read
  idempotent: true
  binding: {gateway_route: erp-trial-balance, api: api://erp-api@1, operation: "GET /ledger/trial-balance"}
