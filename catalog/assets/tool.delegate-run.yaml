kind: tool
name: delegate-run
version: 1
status: active
owner: platform
description: 다른 에이전트에 요청을 넘긴다 (router 전용). 기본 실행에서는 게이트웨이가 접수 기록만 남긴다
permission_scope: [invoke:agent]
mutable_by_sel: []
provenance: {created_by: human}
body:
  input_schema:
    type: object
    properties:
      agent_id: {type: string, description: "넘길 에이전트 id"}
      input: {type: string, description: "그 에이전트에 보낼 요청 원문"}
    required: [agent_id, input]
  output_schema: {type: object, properties: {agent_id: {type: string}, status: {type: string}}}
  side_effect: read
  idempotent: false
  binding: {gateway_route: delegate-run, operation: "POST /threads/{thread_id}/runs"}
