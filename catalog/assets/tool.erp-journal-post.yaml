kind: tool
name: erp-journal-post
version: 1
status: active
owner: platform
description: 전표 전기 (쓰기 · 실행 승인 필수). 차대 균형 · 계정 · 열린 기간을 ERP가 검증한다
permission_scope: [write:ledger]
mutable_by_sel: []
provenance: {created_by: human}
body:
  input_schema:
    type: object
    properties:
      company: {type: string, description: "회사 코드. 실행 범위에서 시스템이 채운다"}
      period: {type: string, description: "YYYY-MM. 비우면 열린 기간"}
      text: {type: string, description: "전표 적요"}
      lines: {type: array, description: "전표 줄 목록. 각 줄은 {account, debit} 또는 {account, credit}"}
    required: [text, lines]
  output_schema: {type: object, properties: {document: {type: string}}}
  side_effect: write
  idempotent: false
  binding: {gateway_route: erp-journal-post, api: api://erp-api@1, operation: "POST /ledger/journal-entries"}
