kind: skill
name: erp/close-check
version: 1
status: active
owner: agents
description: 월마감 준비 점검 (읽기 전용)
inputs: {type: object, properties: {period: {type: string}}}
outputs: {type: object, properties: {ready: {type: boolean}, open_items: {type: array}}}
permission_scope: [read:ledger, read:payables]
mutable_by_sel: [body.instruction, body.default_plan]
provenance: {created_by: human}
eval_cases:
  - id: cc-001
    input: {question: "10월 마감해도 돼?"}
    expected:
      reference: "아직 안 됩니다. 감가상각 2,400,000원과 10월 운반비 미지급 1,800,000원이 전기되지 않았고, PO-4500000102 · PO-4500000103은 송장이 입고보다 많아 확인이 필요하며, 매칭 예외 송장 3건에 지급 보류가 없습니다."
    judge: llm
    rubric:
      pass_score: 0.75
      criteria:
        - {id: not-ready, description: "Concludes the period is not ready to close.", weight: 2}
        - {id: depreciation, description: "Names the missing depreciation entry of 2,400,000.", weight: 2}
        - {id: accrual, description: "Names the missing freight accrual of 1,800,000.", weight: 2}
        - {id: gr-ir, description: "Flags the GR/IR items invoiced but not received (PO-4500000102, PO-4500000103).", weight: 1}
        - {id: ap-blocks, description: "Mentions the match-exception invoices without a payment block.", weight: 1}
body:
  trigger: "월마감 점검 · 마감 준비 · 미전기 반복 전표 · GR/IR 확인"
  instruction: |
    1. erp-close-checklist로 열린 기간의 마감 점검표를 본다.
    2. 통과하지 못한 항목마다 무엇이 문제인지, 해결에 필요한 조치(전표 제안 금액과 계정 포함)를 적는다.
    3. GR/IR 항목은 입고 후 송장 미도착(정상 대기)과 송장 후 입고 없음(확인 필요)을 나눠 적는다.
    4. 필요하면 erp-trial-balance로 계정 잔액을 확인한다. 이 단계에서는 전표를 전기하지 않는다.
  tools: [tool://erp-period-status@active, tool://erp-close-checklist@active, tool://erp-trial-balance@active]
  default_plan: [tool://erp-close-checklist@active]
