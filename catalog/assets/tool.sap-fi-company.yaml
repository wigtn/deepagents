kind: tool
name: sap-fi-company
version: 1
status: active
owner: platform
description: "SAP 회사 코드 조회 — 이름 · 국가 · 통화 · 계정과목표"
permission_scope: [read:sap-fi]
mutable_by_sel: []
provenance: {created_by: human}
body:
  input_schema:
    type: object
    properties:
      company: {type: string, description: "회사 코드. 실행 범위에서 시스템이 채운다"}
  output_schema: {type: object, properties: {CompanyCode: {type: string}, ChartOfAccounts: {type: string}}}
  side_effect: read
  idempotent: true
  binding: {gateway_route: sap-fi-company, api: api://sap-sandbox@1, operation: "GET /API_COMPANYCODE_SRV/A_CompanyCode"}
