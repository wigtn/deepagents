kind: tool
name: erp-stock-read
version: 1
status: active
owner: platform
description: 자재별 재고 · 예약 · 미입고 발주 · 재주문점 · 보충 제안 수량
permission_scope: [read:inventory]
mutable_by_sel: []
provenance: {created_by: human}
body:
  input_schema:
    type: object
    properties:
      company: {type: string, description: "회사 코드. 실행 범위에서 시스템이 채운다"}
      material: {type: string, description: "자재 코드 (예: M-1001). 비우면 전체"}
  output_schema: {type: object, properties: {materials: {type: array}}}
  side_effect: read
  idempotent: true
  binding: {gateway_route: erp-stock-read, api: api://erp-api@1, operation: "GET /stock"}
