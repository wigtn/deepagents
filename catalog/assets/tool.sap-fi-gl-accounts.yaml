kind: tool
name: sap-fi-gl-accounts
version: 1
status: active
owner: platform
description: "SAP 계정과목 조회 — 회사의 계정과목표에서 계정 번호나 이름으로 찾는다"
permission_scope: [read:sap-fi]
mutable_by_sel: []
provenance: {created_by: human}
body:
  input_schema:
    type: object
    properties:
      company: {type: string, description: "회사 코드. 실행 범위에서 시스템이 채운다"}
      accounts: {type: array, description: "계정 번호 목록 (예: [\"11001000\"])"}
      search: {type: string, description: "계정 이름에 들어가는 영어 단어 (예: Bank, Depreciation)"}
  output_schema: {type: object, properties: {accounts: {type: array}}}
  side_effect: read
  idempotent: true
  binding: {gateway_route: sap-fi-gl-accounts, api: api://sap-sandbox@1, operation: "GET /API_GLACCOUNTINCHARTOFACCOUNTS_SRV/A_GLAccountText"}
