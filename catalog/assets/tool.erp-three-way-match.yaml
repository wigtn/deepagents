kind: tool
name: erp-three-way-match
version: 1
status: active
owner: platform
description: "3-way 매칭 — 송장을 구매오더 단가 · 입고 수량과 대조하고 단가 차이 · 수량 초과 · 중복 의심을 찾는다"
permission_scope: [read:payables]
mutable_by_sel: []
provenance: {created_by: human}
body:
  input_schema:
    type: object
    properties:
      company: {type: string, description: "회사 코드. 실행 범위에서 시스템이 채운다"}
      invoice: {type: string, description: "송장 번호. 비우면 모든 송장"}
  output_schema: {type: object, properties: {exceptions: {type: integer}, results: {type: array}}}
  side_effect: read
  idempotent: true
  binding: {gateway_route: erp-three-way-match, api: api://erp-api@1, operation: "GET /vendor-invoices/match"}
