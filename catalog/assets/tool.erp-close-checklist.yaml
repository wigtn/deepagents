kind: tool
name: erp-close-checklist
version: 1
status: active
owner: platform
description: 월마감 점검표. 기간 상태 · 반복 전표 · GR/IR · 매칭 예외 보류 · 채권 대사 · 시산표 균형
permission_scope: [read:ledger]
mutable_by_sel: []
provenance: {created_by: human}
body:
  input_schema:
    type: object
    properties:
      company: {type: string, description: "회사 코드. 실행 범위에서 시스템이 채운다"}
      period: {type: string, description: "YYYY-MM. 비우면 열린 기간"}
  output_schema: {type: object, properties: {ready_to_close: {type: boolean}, checks: {type: array}}}
  side_effect: read
  idempotent: true
  binding: {gateway_route: erp-close-checklist, api: api://erp-api@1, operation: "GET /ledger/close-checklist"}
