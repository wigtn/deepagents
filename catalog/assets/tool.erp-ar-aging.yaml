kind: tool
name: erp-ar-aging
version: 1
status: active
owner: platform
description: 매출채권 연령 분석. 고객별 연체 구간 · 여신 한도 초과액
permission_scope: [read:receivables]
mutable_by_sel: []
provenance: {created_by: human}
body:
  input_schema:
    type: object
    properties:
      company: {type: string, description: "회사 코드. 실행 범위에서 시스템이 채운다"}
      customer: {type: string, description: "고객 코드 (예: C-510). 비우면 전체"}
  output_schema: {type: object, properties: {customers: {type: array}, totals: {type: object}}}
  side_effect: read
  idempotent: true
  binding: {gateway_route: erp-ar-aging, api: api://erp-api@1, operation: "GET /receivables/aging"}
