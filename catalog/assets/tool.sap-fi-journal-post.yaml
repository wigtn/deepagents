kind: tool
name: sap-fi-journal-post
version: 1
status: active
owner: platform
description: "SAP 전표 반영 (쓰기 · 실행 승인 필수) — 샌드박스는 읽기 전용이라 실제 SAP 마스터로 검증한 뒤 그림자 원장에 반영한다"
permission_scope: [write:sap-fi]
mutable_by_sel: []
provenance: {created_by: human}
body:
  input_schema:
    type: object
    properties:
      company: {type: string, description: "회사 코드. 실행 범위에서 시스템이 채운다"}
      text: {type: string, description: "전표 적요"}
      posting_date: {type: string, description: "전기일 YYYY-MM-DD. 비우면 오늘"}
      lines: {type: array, description: "전표 줄 목록. 각 줄은 {account, debit} 또는 {account, credit}"}
    required: [text, lines]
  output_schema: {type: object, properties: {document: {type: string}}}
  side_effect: write
  idempotent: false
  binding: {gateway_route: sap-fi-journal-post, api: api://sap-sandbox@1, operation: "POST /JournalEntryBulkCreationRequest"}
