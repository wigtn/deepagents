kind: tool
name: erp-po-read
version: 1
status: active
owner: platform
description: 구매오더 조회. 발주 · 입고 · 송장 수량과 미입고 수량
permission_scope: [read:purchasing]
mutable_by_sel: []
provenance: {created_by: human}
body:
  input_schema:
    type: object
    properties:
      company: {type: string, description: "회사 코드. 실행 범위에서 시스템이 채운다"}
      po: {type: string, description: "구매오더 번호 (예: PO-4500000102). 비우면 전체"}
      vendor: {type: string, description: "공급사 코드 (예: V-200)"}
  output_schema: {type: object, properties: {purchase_orders: {type: array}}}
  side_effect: read
  idempotent: true
  binding: {gateway_route: erp-po-read, api: api://erp-api@1, operation: "GET /purchase-orders"}
